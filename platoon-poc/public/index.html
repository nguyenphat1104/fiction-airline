<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiction Airline | Platoon POC</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18324b;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:#102e50;color:white;padding:25px max(24px,calc((100vw - 900px)/2))}header h1{margin:0;font-size:28px}header p{margin:6px 0 0;color:#c6dcf4}main{max-width:900px;margin:30px auto;padding:0 18px}.panel{background:white;border:1px solid #dbe5ef;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 5px 20px #1234 0}h2{margin:0 0 18px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select{padding:12px;width:100%;border:1px solid #afc3d8;border-radius:8px;font:inherit}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}button{background:#1768c4;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:14px}button:disabled{opacity:.5;cursor:not-allowed}.flight{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #e2e9f2;padding:16px 0}.flight button{margin:0}.muted{color:#63788c}.error{color:#aa2532;font-weight:600}.success{color:#136b45;font-weight:700}.hidden{display:none}@media(max-width:650px){.fields{grid-template-columns:1fr}.flight{align-items:flex-start;flex-direction:column}}
</style></head><body><header><h1>✈ Fiction Airline</h1><p>Platoon POC-001 · Search → Reserve → Mock Payment → Confirm</p></header><main><section class="panel"><h2>Find a flight</h2><div class="fields"><div><label for="origin">From</label><select id="origin"><option>SGN</option><option>HAN</option></select></div><div><label for="destination">To</label><select id="destination"><option>HAN</option><option>DAD</option></select></div><div><label for="date">Date</label><input id="date" type="date" value="2026-11-15"></div></div><button id="search">Search flights</button><div id="flights" aria-live="polite"></div></section><section class="panel hidden" id="checkout"><h2 id="selected">Passenger details</h2><label for="name">Full name</label><input id="name" autocomplete="name" placeholder="Alex Nguyen"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="alex@example.com"><button id="reserve">Reserve seat</button></section><section class="panel hidden" id="payment"><h2>Mock payment</h2><p>No real payment information is collected.</p><label for="scenario">Test scenario</label><select id="scenario"><option value="success">Payment succeeds</option><option value="decline">Payment declines</option></select><button id="pay">Complete mock payment</button></section><section class="panel hidden" id="confirmation" aria-live="polite"></section><p id="message" role="status"></p></main><script>
const $=id=>document.getElementById(id);let flightId=null,bookingId=null;const money=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(n);const msg=(t,error=false)=>{$('message').className=error?'error':'success';$('message').textContent=t};const api=async(path,options)=>{const r=await fetch(path,options);const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x};
$('search').onclick=async()=>{try{msg('');const p=new URLSearchParams({origin:$('origin').value,destination:$('destination').value,date:$('date').value});const data=await api('/api/flights?'+p);const area=$('flights');area.replaceChildren();if(!data.flights.length){area.textContent='No matching flights.';return;}for(const f of data.flights){const row=document.createElement('div');row.className='flight';const desc=document.createElement('div');const strong=document.createElement('strong');strong.textContent=`${f.id} · ${f.origin} → ${f.destination} · ${f.departure}`;const details=document.createElement('div');details.className='muted';details.textContent=`${money(f.price)} · ${f.seats} seats left`;desc.append(strong,details);const btn=document.createElement('button');btn.textContent='Select flight';btn.disabled=f.seats===0;btn.onclick=()=>{flightId=f.id;$('selected').textContent=`Passenger details · ${f.id}`;$('checkout').classList.remove('hidden');$('payment').classList.add('hidden');$('confirmation').classList.add('hidden');$('checkout').scrollIntoView({behavior:'smooth'});};row.append(desc,btn);area.append(row);}}catch(e){msg(e.message,true)}};
$('reserve').onclick=async()=>{try{const key=crypto.randomUUID();const data=await api('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({flightId,passenger:{name:$('name').value,email:$('email').value},idempotencyKey:key})});bookingId=data.id;$('checkout').classList.add('hidden');$('payment').classList.remove('hidden');msg(`Reservation ${bookingId} created`);}catch(e){msg(e.message,true)}};
$('pay').onclick=async()=>{try{const b=await api(`/api/bookings/${encodeURIComponent(bookingId)}/payments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario:$('scenario').value})});$('payment').classList.add('hidden');$('confirmation').classList.remove('hidden');$('confirmation').replaceChildren();const h=document.createElement('h2');h.textContent='✓ Booking confirmed';const p=document.createElement('p');p.textContent=`Confirmation: ${b.id} · Flight: ${b.flightId} · Passenger: ${b.passenger.name}`;$('confirmation').append(h,p);msg('Mock payment successful.');}catch(e){msg(e.message,true)}};
$('search').click();
</script></body></html>
